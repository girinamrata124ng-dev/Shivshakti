version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafe
      MYSQL_USER: root
      MYSQL_PASSWORD: Nmrt@1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: spring-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cafe
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Nmrt@1234
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: angular-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql_data: